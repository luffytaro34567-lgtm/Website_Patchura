<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00A0E0"/>
    </linearGradient>
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A3D"/>
      <stop offset="100%" stop-color="#020B1E"/>
    </linearGradient>
  </defs>

  <!-- Left / Upper Cyan Shield Facet -->
  <path d="M 16,3 C 12,4 6,5 3,6 C 3,12 3.5,18 7,23 C 10,27 13.5,29.5 16,31 L 16,3 Z" fill="url(#favCyan)"/>

  <!-- Right / Lower Navy Shield Facet -->
  <path d="M 16,3 C 20,4 26,5 29,6 C 29,12 28.5,18 25,23 C 22,27 18.5,29.5 16,31 L 16,3 Z" fill="url(#favNavy)"/>

  <!-- Circuit Trace -->
  <path d="M 7,14 L 11,14 L 14,17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="7" cy="14" r="1.5" fill="#00E5FF" stroke="#FFFFFF" stroke-width="0.8"/>

  <path d="M 9,9 L 13,13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="9" cy="9" r="1.5" fill="#00E5FF" stroke="#FFFFFF" stroke-width="0.8"/>

  <!-- Wrench Tool at 45 degree angle -->
  <g transform="translate(16, 16) rotate(-45) translate(-16, -16)">
    <!-- Wrench Body -->
    <path d="M 14.5,24 C 13.5,22.5 13.5,21 14.5,19.5 L 14.6,12.5 C 13,11.5 12.2,9.8 12.6,8 C 13,6.8 14,5.8 15.2,5.5 L 15.2,8.5 C 15.2,9 15.5,9.2 16,9.2 C 16.5,9.2 16.8,9 16.8,8.5 L 16.8,5.5 C 18,5.8 19,6.8 19.4,8 C 19.8,9.8 19,11.5 17.4,12.5 L 17.5,19.5 C 18.5,21 18.5,22.5 17.5,24 C 16.5,25.2 15.2,25.2 14.5,24 Z" fill="#FFFFFF"/>
    <circle cx="16" cy="22.5" r="1" fill="#071A3D"/>
  </g>
</svg>
