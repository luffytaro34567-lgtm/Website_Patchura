<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Cyan Upper-Left Facet Gradient -->
    <linearGradient id="logoLightCyanFacet" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="45%" stop-color="#00B4E0"/>
      <stop offset="100%" stop-color="#0080B8"/>
    </linearGradient>

    <!-- Deep Navy Lower-Right Facet Gradient -->
    <linearGradient id="logoLightNavyFacet" x1="10%" y1="10%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#0A224D"/>
      <stop offset="50%" stop-color="#071A3D"/>
      <stop offset="100%" stop-color="#04122C"/>
    </linearGradient>

    <!-- Wordmark ORA Cyan Gradient -->
    <linearGradient id="logoLightOraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BCEB"/>
      <stop offset="100%" stop-color="#0088CC"/>
    </linearGradient>

    <!-- Wrench Subtle Shadow Filter -->
    <filter id="logoLightWrenchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#02091A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ── 1. Shield Symbol (Left: X=0..64, Y=0..64) ──────────────────────────── -->
  <g transform="translate(4, 2) scale(0.24)">
    <!-- Cyan Upper-Left Half -->
    <path d="M 125,24 
             C 95,30 55,36 32,45 
             C 30,85 32,130 55,168 
             C 74,198 100,222 125,236 
             L 125,24 Z" 
          fill="url(#logoLightCyanFacet)"/>

    <!-- Navy Lower-Right Half -->
    <path d="M 125,24 
             C 155,30 195,36 218,45 
             C 220,85 218,130 195,168 
             C 176,198 150,222 125,236 
             L 125,24 Z" 
          fill="url(#logoLightNavyFacet)"/>

    <!-- Circuit Traces -->
    <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 72,76 L 96,96"/>
      <path d="M 52,112 L 78,112 L 100,132"/>
      <path d="M 64,152 L 86,152 L 98,140"/>
    </g>

    <circle cx="72" cy="76" r="6.5" fill="#00C8F0" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="52" cy="112" r="6.5" fill="#00C8F0" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="64" cy="152" r="6.5" fill="#00C8F0" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Wrench Tool -->
    <g filter="url(#logoLightWrenchShadow)" transform="translate(125, 125) rotate(-45) translate(-125, -125)">
      <path d="
        M 112,185 
        C 106,175 106,160 114,150 
        L 115,100 
        C 104,95 98,82 101,68 
        C 103,58 111,50 120,48 
        L 120,70 
        C 120,73 122,75 125,75 
        C 128,75 130,73 130,70 
        L 130,48 
        C 139,50 147,58 149,68 
        C 152,82 146,95 135,100 
        L 136,150 
        C 144,160 144,175 138,185 
        C 131,195 119,195 112,185 Z" 
        fill="#FFFFFF"/>
      <circle cx="125" cy="176" r="7" fill="#051433"/>
    </g>
  </g>

  <!-- ── 2. PATCHORA Wordmark (Right) ──────────────────────────────────────── -->
  <g transform="translate(74, 43)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-weight="900" 
          font-size="31" 
          letter-spacing="0.8px">
      <!-- PATCH in Deep Brand Navy -->
      <tspan fill="#071A3D">PATCH</tspan>
      <!-- ORA in Electric Cyan Gradient -->
      <tspan fill="url(#logoLightOraGradient)">ORA</tspan>
    </text>
  </g>
</svg>
